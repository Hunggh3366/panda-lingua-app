<body class="bg-background min-h-screen flex flex-col font-sans text-on-surface">
<!-- Top Navigation (Task-focused, suppressed main nav) -->
<header class="w-full max-w-container-max mx-auto px-md py-sm flex items-center justify-between sticky top-0 z-10 bg-background/90 backdrop-blur-sm">

<div class="w-full bg-surface rounded-2xl border border-border card-shadow p-6 sm:p-8 flex flex-col items-center mb-lg relative">

<div class="flex flex-col items-center mb-6">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-[64px] leading-tight font-bold text-primary mb-2">学</h1>
<div class="flex items-center gap-3">
<span class="font-headline-md text-headline-md text-on-surface-variant">xué</span>
<button aria-label="Phát âm" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-primary-container hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined">volume_up</span>
</button>
</div>
</div>
<!-- Divider -->
<div class="w-full h-px bg-border my-4"></div>
<!-- Meaning Section -->
<div class="w-full text-center mb-6">
<p class="font-body-lg text-body-lg text-on-surface font-medium">học, học tập</p>
<p class="font-body-md text-body-md text-muted-text mt-1">Động từ</p>

<button aria-label="Phát âm ví dụ" class="w-8 h-8 shrink-0 rounded-full bg-surface flex items-center justify-center text-primary-fixed-dim border border-border hover:bg-surface-variant transition-colors mt-1">
<span class="material-symbols-outlined text-[20px]">volume_up</span>

<div>

<p class="font-body-md text-body-md text-muted-text">Tôi học tiếng Hán.</p>
</div>
</div>

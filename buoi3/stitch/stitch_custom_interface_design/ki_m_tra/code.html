<main class="flex-grow flex flex-col items-center justify-start px-md pt-lg pb-xl max-w-container-max mx-auto w-full relative">

<div class="w-full max-w-md mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-label-md text-label-md text-muted-text">Câu hỏi 3/20</span>
<span class="font-label-md text-label-md font-semibold text-secondary">HSK 1</span>
</div>
<div class="w-full bg-border rounded-full h-2 overflow-hidden">
<div class="bg-secondary h-2 rounded-full transition-all duration-300" style="width: 15%"></div>
</div>
</div>
<!-- Quiz Card -->
<div class="w-full max-w-md bg-surface border border-border rounded-xl p-md shadow-sm mb-lg flex flex-col items-center text-center">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 font-bold">míngtiān</span>
<span class="font-headline-md text-headline-md text-primary mb-6">明天</span>
<p class="font-body-md text-body-md text-on-surface-variant mb-2">Chọn nghĩa đúng của từ này</p>
</div>
<!-- Options Grid -->
<div class="w-full max-w-md grid grid-cols-1 gap-sm">
<!-- Normal Option -->
<button class="w-full bg-surface border border-border rounded-lg p-md text-left flex justify-between items-center shadow-[0px_4px_12px_rgba(23,59,108,0.05)] hover:bg-surface-container transition-colors">
<span class="font-body-lg text-body-lg text-on-surface">Hôm qua</span>
</button>
<!-- Correct Option (Selected) -->
<button class="w-full bg-[#E8F5E9] border-2 border-[#4CAF7D] rounded-lg p-md text-left flex justify-between items-center shadow-[0px_4px_12px_rgba(23,59,108,0.05)] transition-colors relative overflow-hidden">
<span class="font-body-lg text-body-lg text-[#005232] font-medium relative z-10">Ngày mai</span>
<span class="material-symbols-outlined text-[#4CAF7D] relative z-10" data-icon="check_circle" data-weight="fill">check_circle</span>
<div class="absolute inset-0 bg-[#4CAF7D] opacity-10"></div>
</button>
<!-- Normal Option -->
<button class="w-full bg-surface border border-border rounded-lg p-md text-left flex justify-between items-center shadow-[0px_4px_12px_rgba(23,59,108,0.05)] hover:bg-surface-container transition-colors">
<span class="font-body-lg text-body-lg text-on-surface">Hôm nay</span>
</button>
<!-- Normal Option -->
<button class="w-full bg-surface border border-border rounded-lg p-md text-left flex justify-between items-center shadow-[0px_4px_12px_rgba(23,59,108,0.05)] hover:bg-surface-container transition-colors">
<span class="font-body-lg text-body-lg text-on-surface">Năm sau</span>
</button>
</div>

<button class="w-full bg-[#4CAF7D] hover:bg-[#3d8c64] text-white font-label-md text-label-md py-3 px-6 rounded-lg transition-colors shadow-md active:scale-95 flex items-center justify-center gap-2">

   PANDA LINGUA — giao diện classic + logic v2
   225 từ, trạng thái thật, 4 quiz, SRS, tra cứu, backup JSON
   ============================================================ */

const STORAGE_KEY = 'panda_lingua_v2';
const LEGACY_PROGRESS_KEY = 'panda_lingua_progress';
const LEGACY_STATS_KEY = 'panda_lingua_stats';

function blankState(){
  return {cards:{}, streak:0, lastActive:null, totalReviews:0, correct:0, quizAttempts:0, quizCorrect:0, history:{}};
}

let state = loadState();

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if(saved && typeof saved === 'object') return normalizeState(saved);
  }catch(e){}
  return migrateLegacy() || blankState();
}

function normalizeState(s){
  const base=blankState();
  const out={...base,...s};
  out.cards = out.cards && typeof out.cards==='object' ? out.cards : {};
  out.history = out.history && typeof out.history==='object' ? out.history : {};
  out.quizAttempts = Number(out.quizAttempts||0);
  out.quizCorrect = Number(out.quizCorrect||0);
  out.totalReviews = Number(out.totalReviews||0);
  out.correct = Number(out.correct||0);
  out.streak = Number(out.streak||0);
  return out;
}

function migrateLegacy(){
  try{
    const legacyProgress=JSON.parse(localStorage.getItem(LEGACY_PROGRESS_KEY)||'null');
    const legacyStats=JSON.parse(localStorage.getItem(LEGACY_STATS_KEY)||'null');
    if(!legacyProgress && !legacyStats) return null;
    const s=blankState();
    if(legacyProgress){
      for(const [id,p] of Object.entries(legacyProgress)){
        if(!VOCAB.some(v=>v.id===id)) continue;
        let due=localDateString();
        if(p.nextReviewAt){ const d=new Date(p.nextReviewAt); if(!Number.isNaN(d.getTime())) due=localDateString(d); }
        s.cards[id]={ef:Number(p.easeFactor||2.5),reps:Number(p.repetition||0),interval:Number(p.interval||0),due};
      }
    }
    if(legacyStats){
      s.streak=Number(legacyStats.streakDays||0);
      s.quizAttempts=Number(legacyStats.totalQuizAttempts||0);
      s.quizCorrect=Number(legacyStats.correctQuizAttempts||0);
    }
    localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
    return s;
  }catch(e){ return null; }
}

function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
function localDateString(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addDays(dateStr,days){
  const [y,m,d]=dateStr.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+days); return localDateString(dt);
}
function card(id){
  if(!state.cards[id]) state.cards[id]={ef:2.5,reps:0,interval:0,due:localDateString()};
  return state.cards[id];
}
function peekCard(id){ return state.cards[id] || {ef:2.5,reps:0,interval:0,due:localDateString()}; }
function updateStreak(){
  const t=localDateString();
  if(state.lastActive===t) return;
  const yesterday=addDays(t,-1);
  state.streak = state.lastActive===yesterday ? state.streak+1 : 1;
  state.lastActive=t;
}
function recordHistory(correct=null){
  const t=localDateString();
  const h=state.history[t]||{reviews:0,correct:0};
  h.reviews++;
  if(correct===true) h.correct++;
  state.history[t]=h;
}
function learnWord(id){
  const c=card(id);
  if(c.reps===0){ c.reps=1; c.interval=1; c.due=addDays(localDateString(),1); }
  updateStreak(); recordHistory(null); save();
}
function review(id,grade){
  const c=card(id);
  if(grade===0){ c.reps=0; c.interval=Math.max(1,Math.round((c.interval||1)/2)); c.ef=Math.max(1.3,(c.ef||2.5)-0.2); }
  else{
    c.reps=(c.reps||0)+1;
    c.ef=Math.min(2.8,(c.ef||2.5)+(grade===2?0.15:0));
    c.interval=c.reps===1?1:c.reps===2?3:Math.max(1,Math.round((c.interval||1)*c.ef));
    if(grade===2) c.interval=Math.max(1,Math.round(c.interval*1.3));
  }
  c.due=addDays(localDateString(),c.interval||1);
  state.totalReviews++;
  if(grade>0) state.correct++;
  updateStreak(); recordHistory(grade>0); save();
}
function recordQuiz(ok,id){
  state.quizAttempts++;
  if(ok) state.quizCorrect++;
  review(id,ok?1:0);
}
function newItems(limit=8,level=''){
  return VOCAB.filter(v=>(!level||v.level===level)&&peekCard(v.id).reps===0).slice(0,limit);
}
function dueItems(level=''){
  const t=localDateString();
  return VOCAB.filter(v=>(!level||v.level===level)&&peekCard(v.id).reps>0&&peekCard(v.id).due<=t);
}
function learnedCount(level=''){ return VOCAB.filter(v=>(!level||v.level===level)&&peekCard(v.id).reps>0).length; }
function masteredCount(level=''){ return VOCAB.filter(v=>(!level||v.level===level)&&peekCard(v.id).reps>=2).length; }
function quizAccuracy(){ return state.quizAttempts?Math.round(state.quizCorrect/state.quizAttempts*100):0; }
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function pick(a,n){ return shuffle(a).slice(0,n); }
function esc(s=''){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

let activeAudio=null;
function speak(text,btn=null){
  if(!text) return;
  if(btn) btn.classList.add('animate-pulse');
  const cleanup=()=>btn&&btn.classList.remove('animate-pulse');
  try{ if(activeAudio){ activeAudio.pause(); activeAudio=null; } }catch(e){}
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  const url=`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text.trim())}&le=zh`;
  try{
    const audio=new Audio(url); activeAudio=audio;
    audio.onended=()=>{cleanup();activeAudio=null};
    audio.onerror=()=>speakWeb(text,cleanup);
    audio.play().catch(()=>speakWeb(text,cleanup));
  }catch(e){ speakWeb(text,cleanup); }
}
function speakWeb(text,cleanup){
  if(!('speechSynthesis' in window)){ cleanup(); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=.85;
  const voice=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('zh')); if(voice)u.voice=voice;
  u.onend=cleanup; u.onerror=cleanup; speechSynthesis.speak(u);
}
let audioCtx;
function tone(kind){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=kind==='ok'?[[523,.12,0],[659,.12,.08],[784,.2,.16]]:[[196,.16,0],[156,.22,.12]];
    notes.forEach(([f,d,delay])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;o.type=kind==='ok'?'sine':'triangle';g.gain.setValueAtTime(.13,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+d);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+d);});
  }catch(e){}
}

  startQuiz(root,mode=this.quizMode){ this.quizMode=mode; this.quizIndex=0; this.quizScore=0; this.nextQuiz(root); }
  makeQuestion(){
    let target=pick(VOCAB,1)[0], prompt='', options=[];
    const distractors=pick(VOCAB.filter(x=>x.id!==target.id),3),pool=shuffle([...distractors,target]);
    if(this.quizMode==='listen'){
      prompt=`<button id="quiz-main-audio" class="mx-auto w-20 h-20 rounded-full bg-[#edf4ff] text-[#173B6C] hover:bg-[#173B6C] hover:text-white flex items-center justify-center shadow-sm"><span class="material-symbols-outlined text-4xl">volume_up</span></button><p class="text-sm text-[#64717D] mt-3">Nghe và chọn nghĩa tiếng Việt đúng</p>`;
      options=pool.map(o=>({html:esc(o.meaning),id:o.id}));
    }else if(this.quizMode==='pinyin'){
      prompt=`<span class="text-sm font-semibold text-[#64717D] mb-1">Pinyin</span><h1 class="text-4xl font-bold text-[#173B6C] mb-2">${esc(target.pinyin)}</h1><p class="text-sm text-[#64717D]">Chọn chữ Hán đúng</p>`;
      options=pool.map(o=>({html:`<span class="text-3xl font-bold" style="font-family:'Noto Sans SC'">${esc(o.hanzi)}</span>`,id:o.id}));
    }else if(this.quizMode==='cloze'){
      let candidates=VOCAB.filter(v=>v.example&&v.example.hanzi.includes(v.hanzi)); if(candidates.length)target=pick(candidates,1)[0];
      const ds=pick(VOCAB.filter(x=>x.id!==target.id),3); const p2=shuffle([...ds,target]);
      const blank=target.example.hanzi.replace(target.hanzi,'______');
      prompt=`<span class="text-sm font-semibold text-[#64717D] mb-2">Điền từ thích hợp</span><h1 class="text-2xl md:text-3xl font-bold text-[#173B6C] mb-2" style="font-family:'Noto Sans SC'">${esc(blank)}</h1><p class="text-sm text-[#64717D]">${esc(target.example.meaning)}</p>`;
      options=p2.map(o=>({html:`<span style="font-family:'Noto Sans SC'" class="font-bold">${esc(o.hanzi)}</span> <span class="text-sm text-[#64717D]">· ${esc(o.meaning)}</span>`,id:o.id}));
    }else{
      prompt=`<span class="text-sm font-semibold text-[#64717D] mb-1">${esc(target.pinyin)}</span><div class="flex items-center justify-center gap-3"><h1 class="text-5xl font-bold text-[#173B6C] mb-2" style="font-family:'Noto Sans SC'">${esc(target.hanzi)}</h1><button id="quiz-main-audio" class="p-2 -mt-1 bg-[#edf4ff] text-[#173B6C] hover:bg-[#173B6C] hover:text-white rounded-full shadow-sm"><span class="material-symbols-outlined text-lg">volume_up</span></button></div><p class="text-sm text-[#64717D] mt-1">Chọn nghĩa tiếng Việt đúng của từ này</p>`;
      options=pool.map(o=>({html:esc(o.meaning),id:o.id}));
    }
    const answerIdx=options.findIndex(o=>o.id===target.id); return {target,prompt,options,answerIdx,answered:false};
  }

text-sm font-semibold mt-4 hidden"></div></div><div class="mt-6 pt-2 pb-4"><button id="quiz-next" class="hidden w-full py-4 bg-[#4CAF7D] hover:bg-[#006C44] text-white font-bold text-base rounded-xl shadow-md transition-all active:scale-[0.98] flex items-center justify-center gap-2"><span>${i===this.quizTotal?'Xem kết quả':'Câu tiếp theo'}</span><span class="material-symbols-outlined">arrow_forward</span></button></div></div>`;

  answerQuiz(root,idx){
    if(this.quiz.answered)return; this.quiz.answered=true; const ok=idx===this.quiz.answerIdx; if(ok){this.quizScore++;tone('ok')}else tone('bad'); recordQuiz(ok,this.quiz.target.id); this.renderShell();

  }
  renderQuizSummary(root){
    const pct=Math.round(this.quizScore/this.quizTotal*100); root.innerHTML=`<div class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto animate-fadeIn"><div class="w-28 h-28 rounded-full bg-gradient-to-tr from-[#e4effd] to-[#edf4ff] p-3 flex items-center justify-center mb-5 border-4 border-white shadow-md"><img class="w-full h-full object-contain" src="${PANDA_CHEER}" alt="Cheering Panda"></div><h2 class="text-2xl md:text-3xl font-bold text-[#173B6C] mb-2">Hoàn thành bài kiểm tra! 🎉</h2><p class="text-sm text-[#64717D] mb-6">Bạn đã trả lời đúng <b>${this.quizScore}/${this.quizTotal}</b> câu hỏi (đạt <b>${pct}%</b>).</p><div class="w-full bg-surface border border-border rounded-2xl p-4 mb-6 shadow-sm flex items-center justify-around"><div class="text-center"><span class="text-xs text-[#64717D]">Chính xác</span><div class="text-2xl font-bold text-[#4CAF7D]">${pct}%</div></div><div class="w-px h-10 bg-[#DCE4E1]"></div><div class="text-center"><span class="text-xs text-[#64717D]">Số câu đúng</span><div class="text-2xl font-bold text-[#173B6C]">${this.quizScore} / ${this.quizTotal}</div></div></div><div class="w-full flex flex-col gap-3"><button id="summary-srs" class="w-full py-4 bg-[#173B6C] hover:bg-[#102B50] text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2"><span>Tiếp tục: Ôn tập SRS</span><span class="material-symbols-outlined">refresh</span></button><button id="summary-retry" class="w-full py-3 bg-white border border-[#DCE4E1] text-[#173B6C] font-semibold rounded-xl hover:bg-[#F7FAF8]">Làm lại bài kiểm tra</button></div></div>`; root.querySelector('#summary-srs').onclick=()=>this.navigate('srs');root.querySelector('#summary-retry').onclick=()=>this.startQuiz(root,this.quizMode);
  }

  startSrs(root){ this.srsSession=dueItems(); this.srsIndex=0; this.srsFlipped=false; this.renderSrsCard(root); }
  renderSrsCard(root){
    if(!this.srsSession.length){ root.innerHTML=`<div class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto animate-fadeIn"><div class="w-24 h-24 rounded-full bg-[#E8F5E9] flex items-center justify-center text-[#4CAF7D] mb-4"><span class="material-symbols-outlined text-5xl">task_alt</span></div><h2 class="text-2xl font-bold text-[#173B6C] mb-2">Chưa có từ đến hạn ôn</h2><p class="text-[#64717D] mb-6">SRS sẽ đưa từ trở lại đúng ngày cần ôn. Bạn vẫn có thể luyện ngẫu nhiên nếu muốn.</p><div class="w-full flex flex-col gap-3"><button id="random-srs" class="w-full py-3.5 bg-[#173B6C] text-white font-semibold rounded-xl">Ôn ngẫu nhiên 6 từ</button><button id="srs-home-empty" class="w-full py-3 bg-white border border-[#DCE4E1] text-[#173B6C] font-semibold rounded-xl">Quay về trang chủ</button></div></div>`;root.querySelector('#random-srs').onclick=()=>{this.srsSession=pick(VOCAB,6);this.renderSrsCard(root)};root.querySelector('#srs-home-empty').onclick=()=>this.navigate('overview');return; }
    if(this.srsIndex>=this.srsSession.length){ root.innerHTML=this.emptyPanel('task_alt','Tuyệt vời! Hoàn thành ôn tập 🌟','Bạn đã hoàn thành phiên ôn tập SRS hôm nay. Trí nhớ của bạn đã được củng cố!','Xem bảng thống kê tiến độ','stats'); this.bindEmpty(root); return; }
    const v=this.srsSession[this.srsIndex],i=this.srsIndex+1,total=this.srsSession.length,p=Math.round(i/total*100);
    root.innerHTML=`<div class="flex-1 flex flex-col justify-between max-w-md mx-auto w-full px-4 py-4 md:py-6 animate-fadeIn min-h-[calc(100vh-120px)]"><div><div class="flex items-center justify-between mb-3"><button id="srs-back" class="p-2 -ml-2 rounded-full hover:bg-slate-100 text-[#173B6C]"><span class="material-symbols-outlined">arrow_back</span></button><div class="text-center"><span class="text-xs font-bold text-[#006C44] bg-[#E8F5E9] px-2.5 py-0.5 rounded-full uppercase tracking-wider">${v.level}</span><h2 class="text-base font-bold text-[#173B6C] mt-0.5">Ôn tập định kỳ SRS</h2></div><div class="w-8"></div></div><div class="flex items-center justify-between text-xs font-semibold text-[#64717D] mb-1.5"><span>Từ cần ôn ${i} / ${total}</span><span class="text-[#006C44]">${p}%</span></div><div class="w-full bg-[#DCE4E1] rounded-full h-2 overflow-hidden mb-4"><div class="bg-[#4CAF7D] h-2 rounded-full" style="width:${p}%"></div></div><p id="srs-hint" class="text-center text-xs md:text-sm text-[#64717D] mb-4">${this.srsFlipped?'💡 Hãy đánh giá mức độ ghi nhớ của bạn:':'👆 Nhớ lại nghĩa & cách đọc, sau đó chạm thẻ để lật:'}</p><div class="perspective-1000 w-full aspect-[4/3] sm:aspect-square relative cursor-pointer select-none" id="srs-card"><div id="srs-inner" class="srs-card-flip w-full h-full rounded-2xl shadow-[0px_4px_16px_rgba(23,59,108,0.06)] border border-[#DCE4E1] ${this.srsFlipped?'flipped':''}"><div class="srs-card-front bg-surface rounded-2xl p-6 flex flex-col items-center justify-center text-center"><span class="text-xs font-bold text-[#64717D] bg-[#edf4ff] px-3 py-1 rounded-full uppercase tracking-wider mb-4">Chữ Hán</span><h1 class="text-7xl font-bold text-[#173B6C] tracking-tight" style="font-family:'Noto Sans SC'">${esc(v.hanzi)}</h1><div class="mt-8 flex flex-col items-center gap-1.5 text-[#64717D]"><span class="w-10 h-10 rounded-full bg-[#F7FAF8] border border-[#DCE4E1] flex items-center justify-center text-[#173B6C] shadow-sm animate-bounce"><span class="material-symbols-outlined text-xl">touch_app</span></span><span class="text-xs font-semibold uppercase tracking-wider">Chạm để lật xem đáp án</span></div></div><div class="srs-card-back bg-surface border-2 border-[#173B6C] rounded-2xl p-6 flex flex-col items-center justify-between text-center"><div><h2 class="text-5xl font-bold text-[#173B6C]" style="font-family:'Noto Sans SC'">${esc(v.hanzi)}</h2><span class="text-2xl font-bold text-[#4CAF7D] mt-1.5 block">${esc(v.pinyin)}</span></div><div class="w-full py-2.5 border-y border-[#DCE4E1] bg-[#F7FAF8] rounded-lg"><span class="text-[11px] text-[#64717D] uppercase font-semibold">Nghĩa tiếng Việt</span><p class="text-base font-bold text-[#173B6C] mt-0.5">${esc(v.meaning)}</p></div><button id="srs-audio" class="flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#edf4ff] hover:bg-[#173B6C] hover:text-white text-[#173B6C] text-sm font-semibold transition-colors shadow-sm"><span class="material-symbols-outlined text-lg">volume_up</span><span>Nghe phát âm</span></button></div></div></div></div><div class="mt-6"><div class="grid grid-cols-3 gap-2.5"><button id="rate-hard" class="flex flex-col items-center justify-center py-3 px-2 bg-surface border border-[#C94A4A] text-[#C94A4A] hover:bg-[#FFEBEE] active:scale-95 rounded-xl transition-all shadow-sm"><span class="material-symbols-outlined text-2xl mb-0.5">sentiment_dissatisfied</span><span class="text-xs font-bold">Khó</span><span class="text-[10px] text-[#64717D] mt-0.5">Ôn lại sớm</span></button><button id="rate-good" class="flex flex-col items-center justify-center py-3 px-2 bg-surface border border-[#173B6C] text-[#173B6C] hover:bg-[#edf4ff] active:scale-95 rounded-xl transition-all shadow-sm"><span class="material-symbols-outlined text-2xl mb-0.5">sentiment_neutral</span><span class="text-xs font-bold">Vừa</span><span class="text-[10px] text-[#64717D] mt-0.5">Theo lịch SRS</span></button><button id="rate-easy" class="flex flex-col items-center justify-center py-3 px-2 bg-[#4CAF7D] text-white hover:bg-[#006C44] active:scale-95 rounded-xl transition-all shadow-md"><span class="material-symbols-outlined text-2xl mb-0.5">sentiment_very_satisfied</span><span class="text-xs font-bold">Dễ</span><span class="text-[10px] text-white/80 mt-0.5">Giãn lịch ôn</span></button></div><div class="mt-4 p-3 bg-surface border border-border rounded-xl flex items-center gap-3"><span class="text-xl">🐼</span><p class="text-xs text-[#64717D]">Hãy tự đánh giá đúng mức độ nhớ để thuật toán SRS lên lịch phù hợp cho bạn.</p></div></div></div>`;
    const inner=root.querySelector('#srs-inner'),hint=root.querySelector('#srs-hint'),audio=root.querySelector('#srs-audio'); root.querySelector('#srs-card').onclick=e=>{if(e.target.closest('#srs-audio'))return;this.srsFlipped=!this.srsFlipped;inner.classList.toggle('flipped',this.srsFlipped);hint.textContent=this.srsFlipped?'💡 Hãy đánh giá mức độ ghi nhớ của bạn:':'👆 Nhớ lại nghĩa & cách đọc, sau đó chạm thẻ để lật:';if(this.srsFlipped)speak(v.hanzi,audio);};audio.onclick=e=>{e.stopPropagation();speak(v.hanzi,audio)};root.querySelector('#srs-back').onclick=()=>this.navigate('overview'); const rate=g=>{review(v.id,g);this.srsIndex++;this.srsFlipped=false;this.renderShell();this.renderSrsCard(root)};root.querySelector('#rate-hard').onclick=()=>rate(0);root.querySelector('#rate-good').onclick=()=>rate(1);root.querySelector('#rate-easy').onclick=()=>rate(2);
  }

  renderBrowse(root){
    const q=(this.browseQuery||'').toLowerCase().trim();
    const list=VOCAB.filter(v=>{const c=peekCard(v.id);const status=c.reps>=2?'mastered':c.reps>0?'learning':'new';return(!this.browseLevel||v.level===this.browseLevel)&&(!this.browseStatus||status===this.browseStatus)&&(!q||v.hanzi.includes(q)||v.pinyin.toLowerCase().includes(q)||v.meaning.toLowerCase().includes(q));});
    const levelPills=[['','Tất cả'],['HSK1','HSK 1'],['HSK2','HSK 2']],statusPills=[['','Mọi trạng thái'],['new','Chưa học'],['learning','Đang học'],['mastered','Đã thuộc']];
    root.innerHTML=`<div class="flex-1 w-full max-w-[1000px] mx-auto px-4 md:px-6 py-6 md:py-8 animate-fadeIn"><div class="flex items-center justify-between mb-5"><div><h1 class="text-2xl md:text-3xl font-bold text-[#173B6C]">Tra cứu từ vựng</h1><p class="text-sm text-[#64717D] mt-0.5">Tìm trong ${VOCAB.length} từ HSK 1–2 theo Hán tự, pinyin hoặc nghĩa tiếng Việt.</p></div><div class="hidden sm:flex w-14 h-14 rounded-full bg-[#edf4ff] items-center justify-center text-[#173B6C]"><span class="material-symbols-outlined text-3xl">search</span></div></div><div class="bg-surface border border-border rounded-2xl p-4 md:p-5 shadow-sm mb-5"><div class="relative"><span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#64717D]">search</span><input id="browse-search" value="${esc(this.browseQuery||'')}" class="w-full pl-10 pr-4 py-3 rounded-xl border-[#DCE4E1] focus:border-[#173B6C] focus:ring-[#173B6C]/20" placeholder="Tìm: 你好, nǐ, xin chào..."></div><div class="mt-4 flex flex-col gap-3"><div class="flex flex-wrap gap-2">${levelPills.map(([id,name])=>`<button data-level="${id}" class="filter-pill ${this.browseLevel===id?'active':''} px-3 py-1.5 rounded-full border border-[#DCE4E1] text-xs font-semibold text-[#64717D] bg-white">${name}</button>`).join('')}</div><div class="flex flex-wrap gap-2">${statusPills.map(([id,name])=>`<button data-status="${id}" class="filter-pill ${this.browseStatus===id?'active':''} px-3 py-1.5 rounded-full border border-[#DCE4E1] text-xs font-semibold text-[#64717D] bg-white">${name}</button>`).join('')}</div></div></div><div class="flex items-center justify-between mb-3"><span class="text-sm font-semibold text-[#173B6C]">${list.length} kết quả</span><span class="text-xs text-[#64717D]">✓ = đã thuộc</span></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3">${list.length?list.map(v=>{const c=peekCard(v.id),status=c.reps>=2?'Đã thuộc':c.reps>0?'Đang học':'Chưa học';return `<div class="bg-surface rounded-2xl p-4 shadow-[0px_2px_8px_rgba(23,59,108,0.04)] border border-border hover:border-[#4CAF7D]/50 transition-colors"><div class="flex items-start justify-between gap-3"><div><div class="flex items-center gap-2 flex-wrap"><span class="text-2xl font-bold text-[#173B6C]" style="font-family:'Noto Sans SC'">${esc(v.hanzi)}</span><span class="text-[#006C44] text-sm font-semibold">${esc(v.pinyin)}</span><span class="text-[10px] px-2 py-0.5 rounded-full ${v.level==='HSK1'?'bg-[#E3F2FD] text-[#173B6C]':'bg-[#F3E5F5] text-[#6A1B9A]'}">${v.level}</span><span class="text-[10px] ${c.reps>=2?'text-[#006C44]':'text-[#64717D]'}">${c.reps>=2?'✓ ':''}${status}</span></div><div class="text-sm mt-1 text-[#17212B]">${esc(v.meaning)}</div></div><button class="browse-audio p-2 rounded-full bg-[#edf4ff] text-[#173B6C] shrink-0" data-hanzi="${esc(v.hanzi)}"><span class="material-symbols-outlined">volume_up</span></button></div><div class="mt-3 pt-3 border-t border-dashed border-[#DCE4E1] text-xs text-[#64717D]"><div class="text-[#173B6C] font-medium" style="font-family:'Noto Sans SC'">${esc(v.example.hanzi)}</div><div class="mt-0.5">${esc(v.example.pinyin)}</div><div class="mt-0.5">${esc(v.example.meaning)}</div></div></div>`}).join(''):'<div class="md:col-span-2 text-center py-12 text-[#64717D]">Không tìm thấy từ phù hợp 😢</div>'}</div></div>`;
    root.querySelector('#browse-search').oninput=e=>{this.browseQuery=e.target.value;this.renderBrowse(root);const input=root.querySelector('#browse-search');if(input){input.focus();input.setSelectionRange(input.value.length,input.value.length);}};root.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{this.browseLevel=b.dataset.level;this.renderBrowse(root)});root.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{this.browseStatus=b.dataset.status;this.renderBrowse(root)});root.querySelectorAll('.browse-audio').forEach(b=>b.onclick=e=>speak(b.dataset.hanzi,e.currentTarget));
  }

  renderStats(root){
    const acc=quizAccuracy(),due=dueItems().length,learned=learnedCount(),mastered=masteredCount();
    const days=[...Array(7)].map((_,idx)=>{const d=new Date();d.setDate(d.getDate()-(6-idx));const key=localDateString(d);return{day:['CN','T2','T3','T4','T5','T6','T7'][d.getDay()],count:state.history[key]?.reviews||0};}); const max=Math.max(...days.map(x=>x.count),1);
    const h1=VOCAB.filter(v=>v.level==='HSK1').length,h2=VOCAB.filter(v=>v.level==='HSK2').length,l1=learnedCount('HSK1'),l2=learnedCount('HSK2'),p1=Math.round(l1/h1*100),p2=Math.round(l2/h2*100);
    root.innerHTML=`<div class="flex-1 w-full max-w-[1200px] mx-auto px-4 md:px-6 py-6 md:py-8 animate-fadeIn"><div class="flex items-center justify-between mb-6"><div><h1 class="text-2xl md:text-3xl font-bold text-[#173B6C]">Thống kê học tập</h1><p class="text-sm text-[#64717D] mt-0.5">Dữ liệu thật được tính từ hoạt động học, quiz và SRS của bạn.</p></div><div class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-[#edf4ff] p-1 border-2 border-white shadow-sm flex items-center justify-center"><img class="w-full h-full object-contain" src="${PANDA_STATS}" alt="Panda Stats"></div></div><div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">${this.metricCard('menu_book','#E8F5E9','#006C44',learned,'Từ đã học')}${this.metricCard('workspace_premium','#FFF8E1','#F9A825',mastered,'Từ đã thuộc')}${this.metricCard('local_fire_department','#FFF3E0','#E65100',state.streak,'Ngày liên tiếp')}${this.metricCard('psychology','#E3F2FD','#173B6C',`${acc}%`,'Độ chính xác quiz')}</div><div class="bg-surface border border-border rounded-2xl p-5 md:p-6 shadow-[0px_4px_12px_rgba(23,59,108,0.04)] mb-6"><div class="flex justify-between items-center mb-6"><div><h3 class="text-base font-bold text-[#173B6C]">Tiến độ học 7 ngày qua</h3><p class="text-xs text-[#64717D]">Số lượt học / ôn / quiz được ghi nhận</p></div><span class="text-xs font-semibold px-2.5 py-1 bg-[#edf4ff] text-[#173B6C] rounded-full">Tổng: ${days.reduce((s,x)=>s+x.count,0)} lượt</span></div><div class="flex items-end justify-between h-44 gap-2 md:gap-4 pt-6">${days.map((x,idx)=>`<div class="flex flex-col items-center gap-2 flex-1 h-full justify-end"><div class="w-full bg-[#edf4ff] rounded-t-lg relative h-full flex items-end overflow-hidden"><div class="w-full ${idx===days.length-1?'bg-[#173B6C]':'bg-[#4CAF7D]'} rounded-t-lg relative" style="height:${Math.max(3,Math.round(x.count/max*100))}%"><div class="absolute -top-6 left-1/2 -translate-x-1/2 text-[11px] font-bold text-[#173B6C]">${x.count}</div></div></div><span class="text-xs font-semibold text-[#64717D]">${x.day}</span></div>`).join('')}</div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">${this.levelProgress('Cấp độ HSK 1 (Cơ bản)',l1,h1,p1,'#4CAF7D')}${this.levelProgress('Cấp độ HSK 2 (Nâng cao)',l2,h2,p2,'#173B6C')}</div><div class="bg-white border border-[#DCE4E1] rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3"><div><p class="text-sm font-semibold text-[#173B6C]">Quản lý dữ liệu</p><p class="text-xs text-[#64717D] mt-0.5">Dữ liệu lưu trong trình duyệt. Bạn có thể xuất JSON để sao lưu.</p></div><div class="flex gap-2 w-full sm:w-auto"><button id="export-data" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl bg-[#173B6C] text-white text-xs font-semibold">⬇ Xuất tiến độ</button><button id="reset-data" class="flex-1 sm:flex-none px-4 py-2.5 rounded-xl bg-[#FFEBEE] text-[#C94A4A] border border-[#FFCDD2] text-xs font-semibold">Đặt lại dữ liệu</button></div></div><div class="mt-3 text-xs text-[#64717D]">Hiện có <b>${due}</b> từ đến hạn ôn SRS.</div></div>`;
    root.querySelector('#export-data').onclick=()=>this.exportData();root.querySelector('#reset-data').onclick=()=>{if(confirm('Bạn có chắc chắn muốn xóa toàn bộ tiến độ học tập?')){localStorage.removeItem(STORAGE_KEY);state=blankState();save();this.renderShell();this.renderStats(root)}};
  }
  levelProgress(title,learned,total,pct,color){return `<div class="bg-surface border border-border rounded-2xl p-5 shadow-[0px_4px_12px_rgba(23,59,108,0.04)]"><div class="flex items-center justify-between mb-2"><span class="text-sm font-bold text-[#173B6C]">${title}</span><span class="text-xs font-bold text-[#006C44]">${learned}/${total} (${pct}%)</span></div><div class="w-full bg-[#E4EFFD] rounded-full h-3 overflow-hidden"><div class="h-full rounded-full" style="width:${pct}%;background:${color}"></div></div></div>`;}
  exportData(){ const payload={app:'Panda Lingua',version:2,exportedAt:new Date().toISOString(),vocabCount:VOCAB.length,state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`panda-lingua-progress-${localDateString()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
  emptyPanel(icon,title,text,button,target){return `<div class="flex-1 flex flex-col items-center justify-center p-6 text-center max-w-md mx-auto animate-fadeIn"><div class="w-24 h-24 rounded-full bg-[#E8F5E9] flex items-center justify-center text-[#4CAF7D] mb-4"><span class="material-symbols-outlined text-5xl">${icon}</span></div><h2 class="text-2xl font-bold text-[#173B6C] mb-2">${title}</h2><p class="text-[#64717D] mb-6">${text}</p><button data-empty-target="${target}" class="w-full py-3.5 bg-[#173B6C] text-white font-semibold rounded-xl shadow hover:bg-[#102B50]">${button}</button></div>`;}
  bindEmpty(root){const b=root.querySelector('[data-empty-target]');if(b)b.onclick=()=>this.navigate(b.dataset.emptyTarget);}
}

document.addEventListener('DOMContentLoaded',()=>{window.appInstance=new PandaApp();});
</script>
